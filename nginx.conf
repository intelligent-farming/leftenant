server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Runtime config: a real file or a 404 — never fall back to index.html, so
    # the app can reliably detect "not provisioned" and show the setup wizard.
    location = /config.json {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # SPA routing — unknown paths render the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
